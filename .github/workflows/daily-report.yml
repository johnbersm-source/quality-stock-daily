name: Daily Quality Stock Report

# 주의: main.py의 build_kr_report/build_us_report가 아직 NotImplementedError
# placeholder 상태이므로, 이 워크플로는 현재 시점에서는 실행해도 실패합니다.
# collector→RawFinancials 매핑 계층 구현이 선행되어야 실제로 동작합니다.
# (2026-09-28, src/main.py 상단 주석 참고)

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 7시 실행 = UTC 전날 22:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 수동 실행(테스트용)

permissions:
  contents: write  # data/pick_history.json 커밋에 필요 (쿨다운 기록 영속화)

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Upload generated PDF as artifact (백업/디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: data/output/*.pdf
          retention-days: 30

      # GitHub Actions 러너는 매번 새로 체크아웃되는 휘발성 환경이라, 쿨다운(최근
      # N일 내 픽 제외) 판단에 쓰는 data/pick_history.json이 러너 안에서만 갱신되고
      # 다음날 실행에는 반영되지 않는다 — 그래서 실행 후 이 파일만 저장소에 다시
      # 커밋해 영속화한다(리포트 PDF나 캐시는 커밋 대상 아님, .gitignore 참고).
      - name: Persist pick history (쿨다운 기록 영속화)
        if: always()
        run: |
          if [ -f data/pick_history.json ]; then
            git config user.name "quality-stock-daily-bot"
            git config user.email "bot@quality-stock-daily.local"
            git add data/pick_history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update pick history [skip ci]"
              git push
            fi
          fi
