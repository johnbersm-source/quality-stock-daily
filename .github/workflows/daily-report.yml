name: Daily Quality Stock Report

# 상태(2026-09-28): build_kr_report/build_us_report 매핑 계층은 구현 완료.
# US는 이 세션에서 실측 라이브 검증까지 끝남(키 불필요). KR은 KRX_AUTH_KEY/
# DART_API_KEY가 리포지토리 Secrets로 등록되기 전까지는 게이트 통과 픽이
# 나오지 않거나 오류가 날 수 있음(README 참고).
#
# 후보군은 2026-09-28부터 매 실행마다 src/universe.py가 동적으로 새로 만든다
# (KR 코스피/코스닥 시가총액 상위 200+150 ≈ 350개, US S&P500 전체 ≈ 500개 —
# 과거의 47개 정적 큐레이션 리스트 대신). 이 때문에 종목당 DART/yfinance
# 호출이 크게 늘어 1회 실행 시간이 예측하기 어려워졌다 — timeout-minutes를
# 넉넉하게 잡아뒀고(90분), 실제 실행시간/성공률은 1차 라이브 실행 후
# 재조정이 필요할 수 있다(src/universe.py 상단 docstring 참고).

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 7시 실행 = UTC 전날 22:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 수동 실행(테스트용)

permissions:
  contents: write  # data/pick_history.json 커밋에 필요 (쿨다운 기록 영속화)

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    # 2026-10-15: 90분 → 180분. 10/8·10/9 실행이 90분 제한에 걸려 취소됨(KR 정성평가 12/20 단계에서 중단).
    # 공개 저장소의 GitHub 호스팅 러너는 무료이므로 상향해도 분 소모 비용은 없다.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-09-29: DART corpCode.xml(전종목 코드 대량다운로드, data/cache/
      # 에 로컬 캐시됨)이 일시적으로 커넥션 타임아웃을 일으킨 적이 있는데,
      # GitHub Actions 러너는 매번 새로 체크아웃되는 휘발성 환경이라
      # data/cache/(.gitignore 대상)가 매일 실행마다 통째로 사라져서 이
      # 무거운 다운로드를 매일 새로 반복해야 했다 — 매일 실패 위험을 안고
      # 가는 구조였다. restore는 가장 최근 캐시를 항상 가져오고(있으면),
      # save는 매 실행마다 새 키로 저장해서 최신 성공본이 계속 누적되게
      # 한다(dart_collector.py의 download_corp_code_map()이 25일 지난
      # 캐시만 갱신 시도하므로 평소엔 네트워크 호출 없이 재사용됨).
      - name: Restore DART corp_code cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: dart-corp-code-map-${{ github.run_id }}
          restore-keys: |
            dart-corp-code-map-

      - name: Run daily pipeline
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 2026-09-29: 정성평가(경제적 해자·IFRS18 MPM·거시, src/qualitative.py)용
          # Gemini API 키. 없으면 main.py가 이 단계를 자동으로 스킵하고 정량
          # 채점만 진행(파이프라인이 죽지는 않음).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2026-09-29: 1차 850종목 실행이 90분 타임아웃으로 취소됐는데
          # stdout이 파이프라인 전체가 끝날 때까지 완전버퍼링되어 로그가
          # 한 줄도 안 찍혀 병목 지점을 못 봤다. -u(unbuffered) + 명시적
          # PYTHONUNBUFFERED로 이중 보장.
          PYTHONUNBUFFERED: "1"
        run: python -u src/main.py

      - name: Save DART corp_code cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: dart-corp-code-map-${{ github.run_id }}

      - name: Upload generated PDF as artifact (백업/디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: data/output/*.pdf
          retention-days: 30

      # GitHub Actions 러너는 매번 새로 체크아웃되는 휘발성 환경이라, 쿨다운(최근
      # N일 내 픽 제외) 판단에 쓰는 data/pick_history.json이 러너 안에서만 갱신되고
      # 다음날 실행에는 반영되지 않는다 — 그래서 실행 후 이 파일만 저장소에 다시
      # 커밋해 영속화한다(리포트 PDF나 캐시는 커밋 대상 아님, .gitignore 참고).
      - name: Persist pick history (쿨다운 기록 영속화)
        if: always()
        run: |
          if [ -f data/pick_history.json ]; then
            git config user.name "quality-stock-daily-bot"
            git config user.email "bot@quality-stock-daily.local"
            git add data/pick_history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update pick history [skip ci]"
              git push
            fi
          fi
