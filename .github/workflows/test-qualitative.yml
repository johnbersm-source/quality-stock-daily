name: Test Qualitative Scoring (진단용, 수동 실행)

# 2026-09-29 신설: 정성평가 3항목(경제적 해자·IFRS18 MPM·거시/사이클,
# src/qualitative.py, Gemini API + Google Search grounding)이 실제로
# 동작하는지 삼성전자(KR) + Microsoft(US) 2종목만으로 가볍게 확인하는
# 전용 워크플로. 850종목 전체를 도는 daily-report.yml을 돌리지 않고도
# 모바일에서 "Run workflow" 한 번으로 Gemini 연동을 점검할 수 있게 했다.
# GEMINI_API_KEY만 필요 — qualitative.py 함수를 KRX/DART 경유 없이 직접
# 호출하도록 설계해서(2026-09-29 수정, main.py _diagnose_qualitative 주석
# 참고) KRX_AUTH_KEY/DART_API_KEY는 필요 없다.
#
# 사용법(모바일 포함): 저장소 Actions 탭 → 왼쪽 목록에서
# "Test Qualitative Scoring" 선택 → "Run workflow" 버튼 → 실행 로그 확인.

on:
  workflow_dispatch: {}

jobs:
  test-qualitative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gemini 쿼터 진단 (모델×grounding 조합별)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m src.main --diagnose-gemini-quota

      - name: 정성평가 진단 (삼성전자 + Microsoft)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m src.main --diagnose-qualitative
