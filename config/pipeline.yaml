# ============================================================
# pipeline.yaml — 파이프라인 설정 (2026-09-28, config/watchlist.yaml 대체)
#
# 이전 버전은 KR 23종목 + US 24종목을 손으로 큐레이션한 "정적 후보군
# 리스트"였다. 리오님 지시: "후보종목을 미리 선정해서 하는게 아니라 매일
# 보고서를 만들어 보낼때 그 시간 기준으로 해당되는 기업을 선정해서 보고서를
# 맞춰서 작성해야해" — 즉 후보군 자체를 매일 실행 시점에 동적으로 만들어야
# 한다. 실제 후보군 계산 로직은 src/universe.py로 옮겼고, 이 파일에는 그
# 로직의 파라미터와 선정(selection) 설정만 남는다.
#
# 후보군 범위 결정 배경(2026-09-28, src/universe.py 상단 docstring에 상세):
# - KR: 원래 "KOSPI200+KOSDAQ150"이 목표였으나, 공식 지수 구성종목 API가
#   없고 비공식 경로는 로그인 의무화(봇탐지)로 자동화 시 계정 정지 위험이
#   있어 "코스피/코스닥 시가총액 상위 N종목"을 대리 지표로 사용하기로
#   리오님과 합의. top_n_kospi/top_n_kosdaq가 그 N값.
# - US: S&P500 실제 구성종목(위키피디아 공개표, 대리 지표 아님) 그대로 사용.
#   별도 파라미터 없음(전체 ~500종목).
# ============================================================

selection:
  cooldown_days: 10          # 최근 N일 내 픽 나온 종목은 후보에서 제외(달력일 기준, 영업일 아님 — 단순화)
  min_gate_pass_required: true  # true = 게이트 미통과 종목은 아예 픽 후보에서 배제
  qualitative_top_n: 20      # 2026-09-29 추가: 정성평가(해자·IFRS18 MPM·거시, src/qualitative.py)는
                             # 정량 상위 N종목에만 적용(850종목 전체는 API 호출량·시간상 비현실적 — 리오님 지시)

universe:
  kr:
    top_n_kospi: 200   # 코스피 시가총액 상위 N (KOSPI200 대리 지표)
    top_n_kosdaq: 150  # 코스닥 시가총액 상위 N (KOSDAQ150 대리 지표)
  us:
    source: sp500_wikipedia  # 위키피디아 "List of S&P 500 companies" 표 스크래핑(us_collector.get_sp500_constituents)
