# ============================================================
# watchlist.yaml — 일일 스코어링 후보군 (초안, 리오님 최종 검토 필요)
#
# 선정 방식(2026-09-28 확정): 매일 아래 후보군 전체를 v3 스코어카드로 채점 →
# stress_test_gate + margin_of_safety_gate를 모두 통과한 종목 중 최고점을
# 그날의 픽으로 선정. 게이트 통과 종목이 하나도 없으면 픽 없음으로 보고하고
# 점수 상위 3개를 "관찰 대상 참고용"으로만 병기(src/selection.py 구현).
# 최근 cooldown_days 영업일 내 이미 픽으로 나온 종목은 그날 후보에서 제외.
#
# 아래 종목 리스트는 제가 초안으로 큐레이션한 것입니다 — 시가총액 상위 +
# 업종 대표주로 일반적으로 널리 인정되는 대형주 위주로 담았습니다. 특정
# 종목이 실제로 v3 스코어카드 기준을 통과할지는 전혀 보장하지 않으며(그건
# 매일 스코어카드가 실측 데이터로 직접 판정합니다), 이 리스트는 순수히
# "채점 대상 후보"일 뿐입니다. 넣고 싶은/빼고 싶은 종목이 있으면 말씀해주세요.
# ============================================================

selection:
  cooldown_days: 10          # 최근 N일 내 픽 나온 종목은 후보에서 제외(달력일 기준, 영업일 아님 — 단순화)
  min_gate_pass_required: true  # true = 게이트 미통과 종목은 아예 픽 후보에서 배제

